name: CI

on:
  push: ~
  pull_request: ~
  workflow_dispatch:
  schedule:
    - cron: '14 22 * * *'

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.5"
          - "8.4"
          - "8.3"
          - "8.2"

        dependencies:
          - "highest"
          - "lowest"
          - "latest"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: "Setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: ${{ matrix.php-version }}
          ini-values: "zend.assertions=1, assert.exception=1, error_reporting=E_ALL, display_errors=On"
          coverage: "xdebug"
          tools: cs2pr
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify PHP version used
        run: |
          php -v && php -m;

      - name: Setup problem matchers for PHP
        run: echo "::add-matcher::${{ runner.tool_cache }}/php.json"

      - name: Setup problem matchers for PHPUnit
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get composer cache directory
        id: composercache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Set up build cache
        uses: "actions/cache@v6"
        with:
          path: |
            ${{ steps.composercache.outputs.dir }}
            "build/php-code-coverage-cache"
            ".php-cs-fixer.cache"
          key: php-${{ matrix.php-version }}-deps-${{ matrix.dependencies }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            php-${{ matrix.php-version }}-deps-${{ matrix.dependencies }}-${{ github.ref }}
            php-${{ matrix.php-version }}-deps-${{ matrix.dependencies }}

      - name: Remove PHP-CS-Fixer if not called
        if: matrix.php-version != '8.2' || matrix.dependencies != 'highest'
        run: composer remove --dev --no-update "friendsofphp/php-cs-fixer";

      - name: Install dependencies (low)
        if: matrix.dependencies == 'lowest'
        run: |
          composer update --prefer-lowest --no-interaction --classmap-authoritative;
          composer show;

      - name: Install dependencies (high)
        if: matrix.dependencies == 'highest'
        run: |
          composer update --no-interaction --classmap-authoritative;
          composer show;

      - name: Install dependencies (latest)
        if: matrix.dependencies == 'latest'
        run: |
          composer config minimum-stability dev;
          composer update --no-interaction --classmap-authoritative;
          composer show

      - name: Install dependencies (force latest)
        if: matrix.dependencies == 'force_latest'
        run: |
          composer config minimum-stability dev;
          composer update --no-interaction --classmap-authoritative --ignore-platform-reqs;
          composer show

      - name: PHPUnit
        run: |
          php -dmemory_limit=-1 vendor/phpunit/phpunit/phpunit --exclude-group=gigs

      - name: Check code style
        if: matrix.php-version == '8.2' && matrix.dependencies == 'highest'
        run: vendor/bin/php-cs-fixer fix --verbose --dry-run --diff --allow-risky=yes --format=checkstyle | cs2pr

  changelog:
    name: Changelog script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test the release script
        run: python3 .github/scripts/test_release_changelog.py

  # workflow_run does not start after a workflow_dispatch sent with
  # GITHUB_TOKEN, so the release is published from this run.
  publish:
    name: Publish release
    needs: [tests, changelog]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: europe-datapack-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether to publish
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          message="$(git log -1 --format=%s)"
          if [[ ! "${message}" =~ ^Release\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "HEAD is not a release commit."
            exit 0
          fi
          version="${BASH_REMATCH[1]}"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${version} already exists."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        if: steps.decide.outputs.publish == 'true'
        shell: bash
        run: python3 .github/scripts/release_changelog.py notes CHANGELOG.md "${{ steps.decide.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      - name: Publish the GitHub release
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "v${{ steps.decide.outputs.version }}" --target "${{ github.sha }}" --title "v${{ steps.decide.outputs.version }}" --notes-file "$RUNNER_TEMP/notes.md"
